<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
        />
        <meta name="robots" content="noindex" />
        <meta
            name="description"
            content="The page you were looking for could not be found."
        />
        <title>Page Not Found | Zest Mavericks</title>

        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; require-trusted-types-for 'script'; trusted-types zm-header zm-footer zm-pricing; upgrade-insecure-requests"
        />
        <meta name="referrer" content="strict-origin-when-cross-origin" />

        <link rel="icon" type="image/png" href="/assets/favicon.png" />
        <link rel="apple-touch-icon" href="/assets/favicon.png" />

        <!-- Self-hosted Poppins (see css/style.css). crossorigin is required:
             fonts are fetched in CORS mode, so without it the preload is wasted. -->
        <link rel="preload" href="/fonts/poppins/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/poppins/poppins-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />

        <!-- Root-relative so it works at any depth GitHub Pages serves it from -->
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/404.css" />

        <!-- Not deferred: these set the theme and draw the header before
             the first paint, so there's no white flash and no late nav. -->
        <script src="/js/theme.js"></script>
        <script src="/js/components/site-header.js"></script>
        <script src="/js/components/site-footer.js" defer></script>
    </head>

    <body class="page-404">
        <a class="skip-link" href="#main">Skip to content</a>

        <site-header></site-header>

        <main class="nf" id="main">
            <div class="nf__stage" aria-hidden="true">
                <div class="nf__sheet nf__sheet--back"></div>
                <div class="nf__sheet nf__sheet--mid"></div>
                <div class="nf__sheet nf__sheet--front">
                    <div class="nf__sheet-head">
                        <span class="nf__dot"></span>
                        <span class="nf__dot"></span>
                        <span class="nf__dot"></span>
                    </div>
                    <div class="nf__code">404</div>
                    <div class="nf__lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="nf__folio">Page 404 of &infin;</div>
                </div>
            </div>

            <p class="nf__eyebrow">Error 404</p>
            <h1 class="nf__title">This page slipped out of the document.</h1>
            <p class="nf__text">
                The link may be old, or the page has moved to a new home.
                Everything else is right where you left it.
            </p>

            <div class="nf__actions">
                <a href="/" class="btn">Back to Home</a>
                <a href="/markpdf/" class="btn btn--ghost">Explore MarkPDF</a>
            </div>

            <p class="nf__more">
                Looking for something specific? Try
                <a href="/about/">About</a> or
                <a href="/contact/">say hi</a>.
            </p>
        </main>

        <site-footer>
            <noscript
                ><p class="footer-fallback">
                    &copy; Zest Mavericks.
                    <a href="/markpdf/terms/">Terms and privacy</a> &middot;
                    <a href="mailto:zestmavericks@gmail.com">Email us</a>
                </p></noscript
            >
        </site-footer>
    </body>
</html>
